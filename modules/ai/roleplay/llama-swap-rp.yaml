# llama-swap config — ROLEPLAY instance (SillyTavern backend). A SECOND, independent llama-swap
# from the companion's: separate container, separate port (host :8081), separate config. The
# companion stack (modules/ai/companion/) is never touched — that's the whole point of the split
# (see the build guide, ~/Projects/local-rp-stack-build-guide.md).
#
# WHY NO `groups:` — the companion guide's Phase 1 assumes coexistence (companion + an RP model
# both resident, evicting nothing). We don't want that: during RP the companion is fully killed
# (rp-on) to free RAM/CPU for the 106B. So this instance only ever holds ONE model at a time, which
# is exactly llama-swap's DEFAULT behavior — requesting a new model evicts the previous one. No
# groups, no persistent/exclusive flags needed. SillyTavern picks the model via the request's
# `model` field; the dropdown populates from /v1/models.
#
# GPU sharing with the companion is by DISCIPLINE, not config: two separate llama-swaps can't see
# each other's VRAM, so the rp-on/rp-off scripts guarantee the companion is unloaded before an RP
# model loads, and vice-versa. All handoffs are explicit.
#
# Models live under /home/suzu/ai-models/models/rp/ (mounted at /models/rp). Download them first —
# see the README. Flags mirror the companion's tuned Vulkan setup: -fa on + quantized KV cache.
#
# The three 24B IQ4_XS models run 28K context with ASYMMETRIC KV (-ctk q8_0 -ctv q4_0): the K cache
# stays full-precision (it matters most for attention quality), V is q4 — ~1.75x the old 16K window
# for only ~+0.35 GB of KV. Runs at ~95% VRAM even on a BUSY desktop (Steam + videos + companion) —
# verified it loads and stays full-speed: amdgpu evicts COOL desktop/browser/video buffers to GTT
# (system RAM; 128 GB here, so GTT is huge & cheap) while keeping the model's hot weights+KV in VRAM.
# The failure mode is NOT a load error — it's a sudden t/s CLIFF in SillyTavern, meaning the driver ran
# out of cool buffers and began evicting the MODEL to GTT (only if you pile on a game / un-stopped
# ComfyUI on top). If that ever bites, drop --ctx-size to ~22528 or lean the desktop for that session.
# So -ngl 99 stays: the GTT safety net beats CPU layer-offload (no speed tax) for a messy desktop.
# Always set SillyTavern's context slider to match --ctx-size, or the extra window is silently wasted.

healthCheckTimeout: 900   # GLM-Air Q4 is ~63 GB split across files; cold load from NVMe is slow.

models:
  "cydonia-24b":
    name: "Cydonia 24B v4.3 — RP daily driver"
    ttl: 900                # bed-reading pauses shouldn't thrash; reload from page cache is ~10-15s.
    cmd: >
      /app/llama-server
      -m /models/rp/TheDrummer_Cydonia-24B-v4.3-IQ4_XS.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --ctx-size 28672
      -fa on -ctk q8_0 -ctv q4_0
      --jinja

  "magidonia-24b":
    name: "Magidonia 24B v4.3 — RP (Magistral prose, Cydonia's sibling)"
    ttl: 900
    cmd: >
      /app/llama-server
      -m /models/rp/TheDrummer_Magidonia-24B-v4.3-IQ4_XS.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --ctx-size 28672
      -fa on -ctk q8_0 -ctv q4_0
      --jinja

  "broken-tutu-24b":
    name: "Broken-Tutu 24B i1-IQ4_XS — RP/ERP (Mistral 24B, Cydonia's cousin → V7-Tekken template)"
    ttl: 900
    # imatrix IQ4_XS (12.8 GB) ≈ Cydonia's IQ4_XS → clean rung-1 fit at 16K, no OOM risk.
    cmd: >
      /app/llama-server
      -m /models/rp/Broken-Tutu-24B.i1-IQ4_XS.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --ctx-size 28672
      -fa on -ctk q8_0 -ctv q4_0
      --jinja

  "magmell-12b":
    name: "Mag-Mell 12B — fast RP / group chats"
    ttl: 900
    cmd: >
      /app/llama-server
      -m /models/rp/MN-12B-Mag-Mell-Q6_K.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --ctx-size 32768
      -fa on -ctk q8_0 -ctv q8_0
      --jinja

  "glm-air-rp":
    name: "GLM Steam v1 106B-A12B — slow-burn big brain"
    ttl: 1800               # 63 GB reload is the expensive one; keep it warm longer.
    # bartowski ships the Q4_K_M split inside a subfolder; point -m at part 1, llama.cpp finds the rest.
    cmd: >
      /app/llama-server
      -m /models/rp/TheDrummer_GLM-Steam-106B-A12B-v1-Q4_K_M/TheDrummer_GLM-Steam-106B-A12B-v1-Q4_K_M-00001-of-00002.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --n-cpu-moe 99 --ctx-size 32768
      -fa on -ctk q8_0 -ctv q8_0
      --threads 12 --jinja

  # Optional floor-reference model (what SpicyChat's cheapest tier runs). Uncomment after download.
